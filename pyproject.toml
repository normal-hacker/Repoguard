[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "repoguard-tool"
version = "0.1.0"
description = "Analyze. Detect. Improve. Open-Source Repository Health Analyzer"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "RepoGuard Contributors" }
]
keywords = [
    "repository-analyzer",
    "code-health",
    "security-scanner",
    "github-actions",
    "developer-tooling"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    "Topic :: Security",
]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pydantic>=2.7.0",
    "gitpython>=3.1.40",
    "pyyaml>=6.0.1",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
    "ruff>=0.4.0",
]

[project.scripts]
repoguard = "repoguard.cli:app"

[project.entry-points."repoguard.plugins"]
# External analyzer plugins register here

[tool.hatch.build.targets.wheel]
packages = ["repoguard"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = [
    "E501", # line length handled by formatter
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "examples/custom_plugin"]
filterwarnings = [
    "ignore::DeprecationWarning",
]
